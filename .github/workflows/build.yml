name: Build and push image

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "TEMPLATE_OVERVIEW.md", "template.json", "test/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold npm install plus a Next production build of a fairly large app.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The default docker driver cannot export a cache, and a cold Next build
      # on every push is a waste of a runner.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          # Railway runs amd64. Building arm64 as well would double the build
          # for nobody.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/lettertrace-railway:0.1.0-r3
            ghcr.io/${{ github.repository_owner }}/lettertrace-railway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
